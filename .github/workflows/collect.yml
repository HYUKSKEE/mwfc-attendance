name: collect

# 소모임 데이터를 1시간마다 수집한다(삭제된 벙 추적용).
# Vercel Hobby 크론은 하루 1회만 되므로 GitHub Actions 스케줄로 /api/cron/collect 를 호출한다.
# 필요한 저장소 Secrets:
#   APP_URL      배포 주소 (예: https://내앱.vercel.app, 끝의 / 없이)
#   CRON_SECRET  Vercel 환경변수 CRON_SECRET 과 같은 값
on:
  schedule:
    - cron: "7 * * * *" # 매시 7분 (정시는 혼잡해서 지연이 커서 피한다)
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call collect endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL / CRON_SECRET secrets 를 설정하세요"; exit 1
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/collect") || code=000
          echo "HTTP $code"; cat body.json 2>/dev/null; echo
          case "$code" in
            200) ;;
            409) echo "이미 수집 중이라 건너뜀" ;;
            *) echo "::error::수집 호출 실패 (HTTP $code)"; exit 1 ;;
          esac
